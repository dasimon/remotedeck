name: Release

on:
  push:
    tags: ['v*']

# Nothing by default; the one job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # TlbImp (Windows SDK) is required to generate the MSTSCLib interop: Windows only.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write          # create the release and attach its files
      id-token: write          # sign the provenance attestation (Sigstore)
      attestations: write      # store it
      artifact-metadata: write # record the attested artifact

    # Actions are pinned by commit, not by tag: a tag can be moved, and this job holds a write token.
    # The comment names the release the commit belongs to; Dependabot keeps both current.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token stays out of .git/config, where every later step — dotnet publish runs the
          # MSBuild targets of every restored package — could read it.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The tag is the single source of truth for the version, deliberately: a <Version> kept in
      # Directory.Build.props is a second place to bump, and the day the two disagree the binary
      # lies about itself with nothing failing. A development build reads 1.0.0 in About, with the
      # commit it was built from after the "+" -- only the shipped executable has to carry the
      # release's number, and that one is built here.
      # The tag comes in through the environment, never pasted into the script: a tag name may hold
      # quotes or $(...), and it would run before the check below could refuse it.
      - name: Take the version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            Write-Host "::error::The tag is not vMAJOR.MINOR.PATCH[-prerelease]; refusing to stamp a version from it."
            exit 1
          }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          Write-Host "Publishing as $($Matches[1])."

      # The same gate as ci.yml: a tag pushed on a commit whose tests fail does not ship.
      - run: dotnet restore RemoteDeck.sln
      - run: dotnet build RemoteDeck.sln --configuration Release --no-restore
      - run: dotnet run --project tests/RemoteDeck.Core.Tests --configuration Release --no-build

      - name: Publish single-file executable (x64, self-contained)
        run: >
          dotnet publish src/RemoteDeck.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o publish

      # Stamping is worth nothing unheard: -p:Version can be silently ignored by a property the
      # project sets later, and the release would ship a binary claiming 1.0.0 with a green run.
      - name: Refuse to ship a binary that does not know its own version
        shell: pwsh
        run: |
          $file = (Get-Item publish/RemoteDeck.exe).VersionInfo
          $expected = $env:VERSION.Split('-')[0]
          if ($file.FileVersion -notlike "$expected*") {
            Write-Host "::error::RemoteDeck.exe reports FileVersion $($file.FileVersion), expected $expected."
            exit 1
          }
          Write-Host "RemoteDeck.exe reports $($file.FileVersion) / $($file.ProductVersion)."

      # The release attaches publish/RemoteDeck.exe and nothing else, so a publish that leaves
      # anything beside it ships a binary that cannot start: native libraries are not bundled
      # unless IncludeNativeLibrariesForSelfExtract is set, and the .exe alone then dies with a
      # DllNotFoundException inside a window procedure -- reported by Windows as 0xC000041D, with
      # no message and no window. That is what 0.1.0 and 0.2.0 shipped. Fail here instead.
      - name: Refuse to ship a single file that is not one
        shell: pwsh
        run: |
          $extra = Get-ChildItem publish -Recurse -File | Where-Object Name -ne 'RemoteDeck.exe'
          if ($extra) {
            Write-Host '::error::publish/ holds more than RemoteDeck.exe -- the attached binary would not start on its own:'
            $extra | ForEach-Object { Write-Host "::error::  $($_.FullName.Substring($PWD.Path.Length + 1))" }
            exit 1
          }
          Write-Host "publish/ holds RemoteDeck.exe alone ($([math]::Round((Get-Item publish/RemoteDeck.exe).Length / 1MB)) MB)."

      # The executable is not code-signed. What a downloader can check instead: the hash, beside it,
      # and the provenance attestation — `gh attestation verify RemoteDeck.exe --repo <owner>/remotedeck`
      # proves the file was built by this workflow from the tagged commit.
      # Written outside publish/, which must hold the executable alone (checked above).
      - name: Compute the SHA-256 of the executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/RemoteDeck.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # The sha256sum format, so `sha256sum -c SHA256SUMS` works as well as Get-FileHash.
          "$hash *RemoteDeck.exe" | Set-Content -Path SHA256SUMS -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: publish/RemoteDeck.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            publish/RemoteDeck.exe
            SHA256SUMS
          generate_release_notes: true
