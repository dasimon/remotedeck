name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # TlbImp (Windows SDK) is required to generate the MSTSCLib interop: Windows only.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The tag is the single source of truth for the version, deliberately: a <Version> kept in
      # Directory.Build.props is a second place to bump, and the day the two disagree the binary
      # lies about itself with nothing failing. Nothing inside RemoteDeck displays its own version,
      # so a development build reading 1.0.0 costs nothing -- only the shipped executable has to be
      # honest, and that one is built here.
      - name: Take the version from the tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            Write-Host "::error::The tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]; refusing to stamp a version from it."
            exit 1
          }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          Write-Host "Publishing as $($Matches[1])."

      - name: Publish single-file executable (x64, self-contained)
        run: >
          dotnet publish src/RemoteDeck.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o publish

      # Stamping is worth nothing unheard: -p:Version can be silently ignored by a property the
      # project sets later, and the release would ship a binary claiming 1.0.0 with a green run.
      - name: Refuse to ship a binary that does not know its own version
        shell: pwsh
        run: |
          $file = (Get-Item publish/RemoteDeck.exe).VersionInfo
          $expected = '${{ env.VERSION }}'.Split('-')[0]
          if ($file.FileVersion -notlike "$expected*") {
            Write-Host "::error::RemoteDeck.exe reports FileVersion $($file.FileVersion), expected $expected."
            exit 1
          }
          Write-Host "RemoteDeck.exe reports $($file.FileVersion) / $($file.ProductVersion)."

      # The release attaches publish/RemoteDeck.exe and nothing else, so a publish that leaves
      # anything beside it ships a binary that cannot start: native libraries are not bundled
      # unless IncludeNativeLibrariesForSelfExtract is set, and the .exe alone then dies with a
      # DllNotFoundException inside a window procedure -- reported by Windows as 0xC000041D, with
      # no message and no window. That is what 0.1.0 and 0.2.0 shipped. Fail here instead.
      - name: Refuse to ship a single file that is not one
        shell: pwsh
        run: |
          $extra = Get-ChildItem publish -Recurse -File | Where-Object Name -ne 'RemoteDeck.exe'
          if ($extra) {
            Write-Host '::error::publish/ holds more than RemoteDeck.exe -- the attached binary would not start on its own:'
            $extra | ForEach-Object { Write-Host "::error::  $($_.FullName.Substring($PWD.Path.Length + 1))" }
            exit 1
          }
          Write-Host "publish/ holds RemoteDeck.exe alone ($([math]::Round((Get-Item publish/RemoteDeck.exe).Length / 1MB)) MB)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/RemoteDeck.exe
          generate_release_notes: true
