name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # TlbImp (Windows SDK) is required to generate the MSTSCLib interop: Windows only.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable (x64, self-contained)
        run: >
          dotnet publish src/RemoteDeck.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/RemoteDeck.exe
          generate_release_notes: true
