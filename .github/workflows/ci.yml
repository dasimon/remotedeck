name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in this workflow writes back to the repository.
permissions:
  contents: read

# One run per ref; pushing again supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # COMReference MSTSCLib needs mstscax.dll's type library registered: Windows only.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RemoteDeck.sln
      - run: dotnet build RemoteDeck.sln --configuration Release --no-restore
      - run: dotnet test RemoteDeck.sln --configuration Release --no-build
