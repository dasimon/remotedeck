name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in this workflow writes back to the repository.
permissions:
  contents: read

# One run per ref; pushing again supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # COMReference MSTSCLib needs mstscax.dll's type library registered: Windows only.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit, the tag in the comment; Dependabot keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RemoteDeck.sln
      - run: dotnet build RemoteDeck.sln --configuration Release --no-restore
      # Not `dotnet test`: an xUnit v3 project is a Microsoft.Testing.Platform application, i.e. an
      # executable that runs its own tests, and running it is the documented way. `dotnet test`'s MTP
      # integration is also broken on this toolchain (SDK 10.0.400 + MTP 2.3.3): it passes --server
      # with no value and the test app rejects it, exit code 5. There is one test project, so this
      # single line replaces the solution-wide invocation exactly.
      - run: dotnet run --project tests/RemoteDeck.Core.Tests --configuration Release --no-build
